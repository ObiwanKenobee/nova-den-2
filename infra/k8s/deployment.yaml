# VaultTap Kubernetes Deployment Manifests
apiVersion: v1
kind: Namespace
metadata:
  name: vaulttap-production
  labels:
    name: vaulttap-production
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaulttap-config
  namespace: vaulttap-production
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_VERSION: "v1"
  AWS_REGION: "us-west-2"
  ENABLE_METRICS: "true"
  ENABLE_HEALTH_CHECKS: "true"
  LOG_LEVEL: "info"

---
apiVersion: v1
kind: Secret
metadata:
  name: vaulttap-secrets
  namespace: vaulttap-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://vaulttap:CHANGE_THIS@postgres:5432/vaulttap"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "CHANGE_THIS_TO_A_SECURE_SECRET"
  ENCRYPTION_KEY: "CHANGE_THIS_TO_A_SECURE_KEY"
  STRIPE_SECRET_KEY: "sk_live_YOUR_STRIPE_SECRET"
  PAYPAL_CLIENT_SECRET: "YOUR_PAYPAL_SECRET"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaulttap-app
  namespace: vaulttap-production
  labels:
    app: vaulttap
    component: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vaulttap
      component: backend
  template:
    metadata:
      labels:
        app: vaulttap
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vaulttap-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: vaulttap
          image: your-registry.com/vaulttap:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vaulttap-config
            - secretRef:
                name: vaulttap-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - vaulttap
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: vaulttap-service
  namespace: vaulttap-production
  labels:
    app: vaulttap
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: vaulttap
    component: backend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaulttap-ingress
  namespace: vaulttap-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.vaulttap.com
      secretName: vaulttap-tls
  rules:
    - host: api.vaulttap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaulttap-service
                port:
                  number: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vaulttap-service-account
  namespace: vaulttap-production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_ACCOUNT:role/VaultTapEKSRole

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vaulttap-hpa
  namespace: vaulttap-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaulttap-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaulttap-pdb
  namespace: vaulttap-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vaulttap
      component: backend

---
apiVersion: v1
kind: Secret
metadata:
  name: vaulttap-registry-secret
  namespace: vaulttap-production
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaulttap-network-policy
  namespace: vaulttap-production
spec:
  podSelector:
    matchLabels:
      app: vaulttap
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432 # PostgreSQL
        - protocol: TCP
          port: 6379 # Redis
        - protocol: TCP
          port: 443 # HTTPS
        - protocol: TCP
          port: 53 # DNS
        - protocol: UDP
          port: 53 # DNS
